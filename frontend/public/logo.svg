<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bh-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D6CF2"/>
      <stop offset="1" stop-color="#2955E7"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect width="64" height="64" rx="15" fill="url(#bh-bg)"/>

  <!-- 贝壳：底部边缘化作海浪（海洋中的宝藏） -->
  <path d="M32 13
           C22 13 14 22 14 31
           C18 34.5 22 34.5 26 31
           C30 27.5 34 27.5 38 31
           C42 34.5 46 34.5 50 31
           C50 22 42 13 32 13 Z"
        fill="#FFFFFF"/>

  <!-- 贝壳高光 -->
  <path d="M23.5 20.5 C25.5 17.5 28.5 16 31.5 15.8"
        stroke="#2955E7" stroke-opacity="0.14" stroke-width="2.5"
        stroke-linecap="round" fill="none"/>

  <!-- 贝唇（贝壳开口） -->
  <path d="M32 19 C33.5 22.5 33.5 25.5 32 28.5"
        stroke="#2955E7" stroke-width="3"
        stroke-linecap="round" fill="none"/>

  <!-- 海浪 -->
  <path d="M20 44 C24 41.5 28 41.5 32 44 C36 46.5 40 46.5 44 44"
        stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5"
        stroke-linecap="round" fill="none"/>
</svg>
